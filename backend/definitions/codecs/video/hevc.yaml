codec: HEVC
ffprobe_name: hevc
options:
  - readable: codec compression type
    type: select
    suboptions:
      - readable: Use NVENC (for nVidia graphics cards)
        select: hevc_nvenc -preset slow
      - readable: Use AMF (for AMD graphics cards)
        select: hevc_amf -quality quality -rc cqp -qp_i 22 -qp_p 24
      - readable: Use CPU
        select: libx265 -crf ${logic:crf_table}
ffmpeg: -c:v {option}
logic:
  - crf_table:
      key: ${ffprobe:height}
      comparison: <=
      values:
        480: 23
        720: 21
        1080: 18
        2160: 15
